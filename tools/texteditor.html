<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <link rel="icon" href="./icons/icon.png" />
    <style>
      textarea {
        font-family: monospace;
        background: #000000;
        color: #00ff00;
        text-align: left;
        padding: 10px 20px;
        outline: none;
        border: none;
        resize: none;
      }
      textarea:focus {
        outline: none;
        border: none;
      }
    </style>
  </head>
  <body>
    <textarea spellcheck="false" autofocus="true"></textarea>
    <script>
      const userClientWidth = document.documentElement.clientWidth;
      const userClientHeight = document.documentElement.clientHeight;
      const textarea = document.querySelector("textarea");
      textarea.style.width = `${userClientWidth}px`;
      textarea.style.height = `${userClientHeight}px`;
      textarea.style.margin = '0px';
      textarea.style.boxSizing = 'border-box'
      document.body.style.margin = '0';
      document.body.style.overflow = 'hidden';
      document.addEventListener("keydown", function(e){
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() == "s") {
          e.preventDefault();
          const blob = new Blob([textarea.value], {type: "text/plain"});
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = prompt("Enter filename: ", "note.txt");
          link.click();
        }
      });
    </script>
  </body>
</html>
